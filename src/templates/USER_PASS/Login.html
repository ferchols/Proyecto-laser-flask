<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/USER_PASS_CSS/Login.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="login-container">
        <h2>Inicio de Sesión</h2>
    
        <!-- Etiqueta de Selección de Rol -->
        <label for="role" class="form-label">Selecciona tu rol:</label>
    
        <form action="{{ url_for('Login_rutas.Iniciar_sesion') }}" method="POST" class="row g-3">
            <!-- Selección de Rol -->
            <div class="col-auto">
                <select name="role" id="role" class="form-control" required>
                    <!-- Establecer el rol cliente como predeterminado -->
                    <option value="empleado">Empleado</option>
                    <option value="cliente" selected>Cliente</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>
    
            <!-- Usuario -->
            <div class="col-auto">
                <label for="usuario" class="visually-hidden">Usuario</label>
                <input type="text" name="USUARIO" id="usuario" class="form-control" placeholder="Usuario" required>
            </div>
    
            <!-- Contraseña -->
            <div class="col-auto">
                <label for="password" class="visually-hidden">Contraseña</label>
                <input type="password" name="PASS" id="password" class="form-control" placeholder="Contraseña" required>
            </div>
    
            <!-- Botón de Iniciar Sesión -->
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </div>
        </form>
    
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
    </div>

      

      
     
      
      

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
