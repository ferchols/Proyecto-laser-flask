<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPLEADOS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/USER_PASS_CSS/Empleados_layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/USER_PASS_CSS/EMPLEADOS_CSS/Empleados_home.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/TIENDA.css/BOSTON_125ml.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/TIENDA.css/Layout-productos.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/Home.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='JS//HOME_JS/Carrusel-contenedor-4.js') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='JS/HOME_JS/Video_home.js') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='JS/LAYOUT_JS/animacion_textos.js') }}">
</head>

<body>
    <!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid navbar-container">
        <!-- Logo alineado a la izquierda -->
        <a class="navbar-brand me-auto" href="/">
            <img src="/static/Archivos/Grupo_laser.png" alt="Grupo Laser" class="navbar-logo">
        </a>

        <!-- Botón responsive -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Elementos del navbar -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
            <!-- Íconos centrados -->
            <ul class="navbar-nav d-flex flex-row gap-3">
                <!-- Campana de Notificaciones -->
                <li class="nav-item position-relative">
                    <button type="button" class="btn btn-outline-light position-relative p-2" data-bs-toggle="modal" data-bs-target="#notificationsModal" style="font-size: 24px; border: none;">
                        <i class="fas fa-bell"></i>
                    </button>
                    <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill" id="notification-count">{{ notifications_count }}</span>
                </li>

                <!-- Audífonos (Soporte Técnico) -->
                <li class="nav-item position-relative">
                    <button type="button" class="btn btn-outline-light position-relative p-2" data-bs-toggle="modal" data-bs-target="#supportModal" style="font-size: 24px; border: none;">
                        <i class="fas fa-headset"></i>
                    </button>
                    <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill" id="support-count">{{ support_requests }}</span>
                </li>

                <!-- Chat -->
                <li class="nav-item position-relative">
                    <button type="button" class="btn btn-outline-light position-relative p-2" data-bs-toggle="modal" data-bs-target="#chatModal" style="font-size: 24px; border: none;">
                        <i class="fas fa-comments"></i>
                    </button>
                    <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill" id="chat-count">{{ chat_messages }}</span>
                </li>
            </ul>
        </div>

        <!-- Botón de descarga y cerrar sesión alineados a la derecha -->
        <div class="d-flex ms-auto align-items-center">
            <a class="nav-link me-3" href="{{ url_for('static', filename='Archivos/ESTE.xlsx') }}" download="ESTE.xlsx">Descarga EVANDER</a>
            <a href="{{ url_for('Login_rutas.Cerrar_sesion') }}" class="btn btn-danger">Cerrar Sesión</a>
        </div>
    </div>
</nav>


    
<div class="row g-0">
    <div class="col-12 col-md-2 "> <!-- Cambia col-md-3 a col-md-2 -->
        <!-- Barra lateral -->
        <aside class="sidebar">
            <nav class="menu">
                <a href="{{ url_for('Login_rutas.empleados')}}">Mi portal</a>
                <a href="{{ url_for('Empleados_rutas.Empleados_Registros')}}">Registros</a>
                <a href="#">Horarios</a>
                <a href="#">Ausencias</a>
                <a href="#">Tareas</a>
                <a href="#">Documentos</a>
                <a href="#">Equipo</a>
                <a href="#">Objetivos</a>
                <a href="#">Perfil</a>
                <a href="#">Crecimiento</a>
                <a href="#">Cuestionario</a>
                <a href="#">Capacitaciones</a>
            </nav>
        </aside>
    </div>
    
    <div class="col-12 col-md-10 overflow-hidden"> <!-- Cambia col-md-9 a col-md-10 -->
        {% block content %}
        {% endblock %}
    </div>
</div>

    <!-- Contenido principal -->
   

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
   <!-- video -->
    <!-- Enlace al archivo JavaScript -->
    <script src="{{ url_for('static', filename='JS//HOME_JS/Carrusel-contenedor-4.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/HOME_JS/Video_home.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/LAYOUT_JS/animacion_textos.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/TIENDA_JS/Layout-Productos.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/USER_PASS_JS/EMPLEADOS_JS/Empleado_home.js') }}"></script>
    <!-- JS de Flatpickr -->
     
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>
