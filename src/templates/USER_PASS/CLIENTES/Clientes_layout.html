<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIENTES</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <link rel="stylesheet" href="{{ url_for('static', filename='css/Layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/USER_PASS_CSS/CLIENTES_CSS/Cliente.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/TIENDA_css/Tienda_html.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/TIENDA_css/CARRITO_CLIENTES.css') }}">

    
    <!-- CSS de Flatpickr -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid navbar-container">
            <ul class="navbar-nav mb-2 mb-lg-0">
            <a class="navbar-brand" href="/">
                <img src="/static/Archivos/Grupo_laser.png" alt="Grupo Laser" class="navbar-logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            
            <li class="nav-item">
                <a class="nav-link" aria-current="page" href="{{ url_for('Login_rutas.clientes') }}">Nuevo pedido</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" aria-current="page" href="{{ url_for('Login_rutas.clientes') }}">Pedidos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" aria-current="page" href="{{ url_for('Login_rutas.clientes') }}">Datos del Cliente</a>
            </li>
        </ul>

        <ul class="navbar-nav mb-2 mb-lg-0">
               
            
                    <!-- Botón para el carrito de compras -->
                    <li class="nav-item position-relative">
                        <button type="button" class="btn btn-outline-light position-relative p-2" data-bs-toggle="modal" data-bs-target="#staticBackdrop" style="font-size: 24px; border: none;">
                            <i class="fas fa-shopping-cart"></i>
                        </button>
                        <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill" id="cart-count">{{ cart_items }}</span>
                    </li>
                
                <!-- Botón para cerrar sesión -->
                <a href="{{ url_for('Login_rutas.Cerrar_sesion') }}" class="btn btn-danger ms-2">Cerrar Sesión</a>
            </ul>
        </div>
    </nav>

 <!-- Modal para nuevo pedido -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="staticBackdropLabel">Carrito de Compras</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body position-relative">
                <div id="cart-items-container" class="mb-4">
                    <!-- Los productos se generarán aquí dinámicamente -->
                </div>

                <!-- Mini tabla con resumen -->
                 
                <div class="row">
                    <div class="col-md-6">
                    <div class="modal-body position-relative">
                        <label for="fecha-entrega" class="form-label">Fecha de Entrega</label>
                        <input type="text" id="fecha-entrega" placeholder="Selecciona la fecha de entrega" class="form-control fecha-entrega-input">
                    </div>
                </div>
                <div class="col-md-6">
                    <table class="table table-striped table-bordered border-primary">
                        <thead>
                            <tr>
                                <th scope="row">Cantidad</th>
                                <td id="Total-cantidad">0</td>
                            </tr>
                            <tr>
                                <th scope="row">Costo total</th>
                                <td id="costo-total">0.00</td>
                            </tr>
                            <tr>
                                <th scope="row">IVA</th>
                                <td id="iva-total" style="display:none;">0.00</td>
                            </tr>
                            <tr>
                                <th scope="row">Costo Final</th>
                                <td id="costo-final">0.00</td>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Aquí va el contenido de los productos -->
                        </tbody>
                    </table>
                </div>
                </div>
            </div>
            

            <div class="modal-footer">
                <button id="reiniciar-carrito" class="btn btn-danger">Reiniciar Carrito</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary">Proceder al pago</button>
            </div>
        </div>
    </div>
</div>


    <!-- Contenido principal -->
    {% block content %}
    {% endblock %}

    <!-- Scripts de Bootstrap y JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script src="{{ url_for('static', filename='JS/LAYOUT_JS/animacion_textos.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/USER_PASS_JS/CLIENTE_JS/Cliente-Cards-Productos.js') }}"></script>
    <script src="{{ url_for('static', filename='JS/USER_PASS_JS/CLIENTE_JS/Cliente-Carrito.js') }}"></script>
    <!-- JS de Flatpickr -->
     
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

</body>
</html>
